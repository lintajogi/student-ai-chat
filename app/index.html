<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student AI Chat</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-box {
      background: #1e1e1e;
      width: 420px;
      height: 550px;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    h3 {
      text-align: center;
      margin-bottom: 10px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .bubble {
      max-width: 75%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      animation: fadeIn 0.3s ease-in;
    }

    .user {
      background: #0078ff;
      margin-left: auto;
      text-align: right;
    }

    .bot {
      background: #2d2d2d;
      margin-right: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .input-area {
      display: flex;
      gap: 5px;
    }

    textarea {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
      resize: none;
      font-family: Arial, sans-serif;
    }

    button {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #00c853;
      color: black;
      font-weight: bold;
    }

    .typing {
      font-style: italic;
      color: #aaa;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="chat-box">
  <h3>Student AI 🤖</h3>

  <div id="messages"></div>

  <div class="input-area">
    <textarea
      id="input"
      placeholder="Type your message..."
      rows="2"
      onkeydown="handleKey(event)"
    ></textarea>

    <button onclick="clearChat()" style="background:#ff5252;">Clear</button>
<button onclick="sendMessage()">Send</button>

  </div>
</div>

<script>
function clearChat() {
  const messages = document.getElementById("messages");
  messages.innerHTML = "";
}

function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  const text = input.value.trim();
  if (!text) return;

  messages.innerHTML += `<div class="bubble user">${text}</div>`;
  input.value = "";
  messages.scrollTop = messages.scrollHeight;

  const typingDiv = document.createElement("div");
  typingDiv.className = "typing";
  typingDiv.innerText = "AI is typing...";
  messages.appendChild(typingDiv);
  messages.scrollTop = messages.scrollHeight;

  const response = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await response.json();
  typingDiv.remove();

  messages.innerHTML += `<div class="bubble bot">${data.reply}</div>`;
  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
